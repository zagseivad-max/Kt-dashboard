name: Process Faction PDFs

on:
  push:
    paths:
      - 'pdfs/**/*.pdf'
  workflow_dispatch:

jobs:
  convert-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai pydantic

      - name: Run Converter Script
        id: convert
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/process_pdfs.py

      - name: Commit and Push Generated Factions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A pdfs/ factions/ factions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update faction JSON and registry from Kill Team PDFs"
            git pull --rebase --autostash origin "${GITHUB_REF#refs/heads/}"
            git push
          else
            echo "No new or updated faction files to commit"
          fi

      - name: Fail Job If Any PDF Failed
        if: steps.convert.outcome == 'failure'
        run: |
          echo "One or more PDFs failed during conversion; any completed factions were committed."
          exit 1
