name: Process Faction PDFs

on:
  push:
    paths:
      - 'pdfs/**.pdf'
  workflow_dispatch:

jobs:
  convert-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai pydantic

      - name: Run Converter Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/process_pdfs.py

      - name: Commit and Push New Factions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add factions/ factions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generated faction JSON from new PDF" && git push)
